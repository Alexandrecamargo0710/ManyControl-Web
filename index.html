    <title>ManyControl</title>
    
    <base href="/ManyControl-Web/" />

    <meta name="description" content="Controle financeiro pessoal inteligente, rápido e seguro." />
    <meta name="theme-color" content="#0b0f19" />
    
    <script>
        (function() {
            var savedTheme = localStorage.getItem('manycontrol_theme') || 'dark';
            document.documentElement.setAttribute('data-theme', savedTheme);
            if (savedTheme === 'light') {
                var meta = document.querySelector('meta[name="theme-color"]');
                if (meta) meta.setAttribute('content', '#f8fafc');
            }
        })();
    </script>

    <div id="app">
        <div class="splash-screen">
            <img src="icon-192.png" alt="ManyControl" class="splash-logo" />
            <div class="splash-title">ManyControl</div>
            <div class="splash-spinner"></div>
            <div class="splash-sub">Carregando seu controle financeiro...</div>
        </div>
    </div>

    <div id="blazor-error-ui">
        Ocorreu um erro inesperado.
        <a href="." class="reload">Recarregar</a>
        <span class="dismiss">🗙</span>
    </div>

    <script src="_framework/blazor.webassembly.w3qd1tpl0e.js"></script>
    <script src="js/app.js?v=1.0.15"></script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('service-worker.js', { updateViaCache: 'none' }).then(reg => {
                reg.update();
            });

            let refreshing = false;
            navigator.serviceWorker.addEventListener('controllerchange', () => {
                if (!refreshing) {
                    refreshing = true;
                    window.location.reload();
                }
            });
        }
    </script>
