<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>ManyControl</title>
    
    <!-- Base URL dinâmica para compatibilidade local e GitHub Pages -->
    <script>
        (function () {
            var path = window.location.pathname;
            var segments = path.split('/').filter(Boolean);
            var isGitHubPages = window.location.hostname.endsWith('github.io');
            var baseHref = isGitHubPages && segments.length > 0 ? '/' + segments[0] + '/' : '/';
            var baseEl = document.createElement('base');
            baseEl.href = baseHref;
            document.head.appendChild(baseEl);
        })();
    </script>

    <meta name="description" content="Controle financeiro pessoal inteligente, rápido e seguro." />
    <meta name="theme-color" content="#09090b" />
    
    <!-- iOS Meta Tags & PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ManyControl" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="icon-192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="icon-512.png" />

    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="manifest.webmanifest" rel="manifest" />
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Bootstrap Icons & App Styles -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/app.css" />
    <link href="ManyControl-Web.styles.css" rel="stylesheet" />
</head>

<body>
    <div id="app">
        <div class="splash-screen">
            <img src="icon-192.png" alt="ManyControl" class="splash-logo" />
            <div class="splash-title">ManyControl</div>
            <div class="splash-spinner"></div>
            <div class="splash-sub">Carregando seu controle financeiro...</div>
        </div>
    </div>

    <div id="blazor-error-ui">
        Ocorreu um erro inesperado.
        <a href="." class="reload">Recarregar</a>
        <span class="dismiss">🗙</span>
    </div>

    <script src="_framework/blazor.webassembly.js"></script>
    <script src="js/app.js"></script>
    <script>navigator.serviceWorker.register('service-worker.js', { updateViaCache: 'none' });</script>
</body>

</html>
