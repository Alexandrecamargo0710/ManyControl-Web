name: Deploy ManyControl Web PWA to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build Blazor WASM & Deploy Pages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publicar Aplicação WebAssembly (Release)
        run: dotnet publish ManyControl-Web.csproj -c Release -o release

      - name: Ajustar Base Tag e Fallbacks para GitHub Pages
        run: |
          # Garante que .nojekyll exista para o GitHub Pages não ignorar arquivos com _
          touch release/wwwroot/.nojekyll
          
          # Cria o 404.html copiando index.html para suporte a SPA routing
          cp release/wwwroot/index.html release/wwwroot/404.html

      - name: Deploy no branch gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: release/wwwroot
          branch: gh-pages
